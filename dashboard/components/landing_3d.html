<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STOCKSENSE Cinematic 3D Hero</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #070a14;
            overflow: hidden;
        }
        #hero-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hero-canvas"></div>

    <script>
        let scene, camera, renderer;
        let crates = [];
        let particles;
        let mouseX = 0, mouseY = 0;

        function init() {
            const container = document.getElementById('hero-canvas');
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth || window.innerWidth, container.clientHeight || window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x070a14, 0.02);

            camera = new THREE.PerspectiveCamera(50, (container.clientWidth || window.innerWidth) / (container.clientHeight || window.innerHeight), 0.1, 1000);
            camera.position.set(0, 14, 30);

            // Ambient & Directional Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);

            const cyanLight = new THREE.DirectionalLight(0x00f3ff, 1.2);
            cyanLight.position.set(15, 25, 15);
            scene.add(cyanLight);

            const purpleLight = new THREE.PointLight(0xbf00ff, 1.5, 80);
            purpleLight.position.set(-15, 20, -15);
            scene.add(purpleLight);

            // Ground Holographic Grid
            const grid = new THREE.GridHelper(60, 60, 0x00f3ff, 0x1e293b);
            grid.position.y = 0;
            scene.add(grid);

            // Create Aisle Shelves & Crates
            const shelfGeo = new THREE.BoxGeometry(26, 0.4, 6);
            const shelfMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8, roughness: 0.2 });

            for (let row = 0; row < 3; row++) {
                const zPos = (row - 1) * 12;
                for (let level = 0; level < 3; level++) {
                    const shelf = new THREE.Mesh(shelfGeo, shelfMat);
                    shelf.position.set(0, level * 4 + 0.2, zPos);
                    scene.add(shelf);

                    // Place product crates along shelf
                    for (let c = 0; c < 6; c++) {
                        const xPos = -10 + c * 4;
                        const isRedFlicker = Math.random() < 0.2;
                        const colorHex = isRedFlicker ? 0xff0055 : (Math.random() < 0.4 ? 0xffaa00 : 0x00ff88);

                        const crateGeo = new THREE.BoxGeometry(2.4, 2.0, 2.4);
                        const crateMat = new THREE.MeshStandardMaterial({
                            color: colorHex,
                            emissive: colorHex,
                            emissiveIntensity: isRedFlicker ? 0.8 : 0.2,
                            roughness: 0.3
                        });

                        const crate = new THREE.Mesh(crateGeo, crateMat);
                        crate.position.set(xPos, level * 4 + 1.4, zPos);
                        crate.userData = { isFlicker: isRedFlicker, initialY: level * 4 + 1.4 };
                        scene.add(crate);
                        crates.push(crate);
                    }
                }
            }

            // Floating Data Particles
            const particleCount = 250;
            const particleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 50;
                positions[i + 1] = Math.random() * 20;
                positions[i + 2] = (Math.random() - 0.5) * 50;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particleMat = new THREE.PointsMaterial({
                color: 0x00f3ff,
                size: 0.25,
                transparent: true,
                opacity: 0.7
            });

            particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);

            document.addEventListener('mousemove', onDocumentMouseMove);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - window.innerWidth / 2) * 0.0005;
            mouseY = (event.clientY - window.innerHeight / 2) * 0.0005;
        }

        function onWindowResize() {
            const container = document.getElementById('hero-canvas');
            const w = container.clientWidth || window.innerWidth;
            const h = container.clientHeight || window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Slow Orbiting Camera with Mouse Parallax
            const time = Date.now() * 0.0002;
            camera.position.x = Math.sin(time) * 32 + mouseX * 20;
            camera.position.z = Math.cos(time) * 32 + mouseY * 20;
            camera.lookAt(0, 5, 0);

            // Red Crate Flicker Effect
            crates.forEach(c => {
                if (c.userData.isFlicker) {
                    c.material.emissiveIntensity = 0.4 + Math.sin(Date.now() * 0.01 + c.position.x) * 0.4;
                }
            });

            // Animate Particles Floating Upwards
            const pos = particles.geometry.attributes.position.array;
            for (let i = 1; i < pos.length; i += 3) {
                pos[i] += 0.03;
                if (pos[i] > 22) pos[i] = 0;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
