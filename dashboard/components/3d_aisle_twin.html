<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STOCKSENSE 3D Store Digital Twin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #070a14;
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-overlay {
            position: absolute;
            top: 12px;
            left: 16px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .ui-btn {
            background: linear-gradient(135deg, #00f3ff, #bf00ff);
            color: #070a14;
            font-weight: 700;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .ui-btn:hover {
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.8);
            transform: scale(1.05);
        }
        #tooltip {
            position: absolute;
            display: none;
            background: rgba(7, 10, 20, 0.95);
            border: 1px solid #00f3ff;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.85rem;
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        #fallback-2d {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0055;
            font-size: 1.2rem;
            text-align: center;
        }
    </style>
    <!-- Three.js CDN & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-overlay">
        <span style="font-weight: 700; color: #00f3ff; font-family: monospace;">3D DIGITAL TWIN</span>
        <button class="ui-btn" id="btn-replay">Replay 7-Day Drain</button>
        <button class="ui-btn" id="btn-refill" style="background: linear-gradient(135deg, #00ff88, #00f3ff);">Refill Order</button>
        <span id="status-text" style="font-size: 0.8rem; color: #94a3b8;">Click item to inspect</span>
    </div>
    <div id="tooltip"></div>
    <div id="fallback-2d">WebGL unavailable. Switching to 2D Fallback Heatmap Mode.</div>

    <script>
        let scene, camera, renderer, controls;
        let itemCrates = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let hoveredItem = null;
        let isAnimating = false;

        // Default item data passed from Streamlit
        let itemsData = [
            { id: 'S01-P001', store: 'S01', product: 'Milk 1L', category: 'Dairy', stock: 20, forecast: 70, prob: 0.85, risk: 'HIGH' },
            { id: 'S01-P002', store: 'S01', product: 'Bread 400g', category: 'Bakery', stock: 45, forecast: 50, prob: 0.25, risk: 'LOW' },
            { id: 'S01-P003', store: 'S01', product: 'Soda 500ml', category: 'Beverages', stock: 30, forecast: 65, prob: 0.60, risk: 'MEDIUM' },
            { id: 'S01-P004', store: 'S01', product: 'Rice 5kg', category: 'Pantry', stock: 15, forecast: 25, prob: 0.45, risk: 'MEDIUM' },
            { id: 'S01-P005', store: 'S01', product: 'Shampoo 250ml', category: 'Personal Care', stock: 25, forecast: 20, prob: 0.10, risk: 'LOW' }
        ];

        function init() {
            const container = document.getElementById('canvas-container');
            
            // WebGL Support Check
            try {
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            } catch (e) {
                document.getElementById('fallback-2d').style.display = 'block';
                return;
            }

            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x070a14, 0.025);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 18, 28);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.05;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00f3ff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xbf00ff, 1.2, 50);
            pointLight.position.set(-10, 15, -10);
            scene.add(pointLight);

            // Ground Grid
            const grid = new THREE.GridHelper(40, 40, 0x00f3ff, 0x1e293b);
            grid.position.y = 0;
            scene.add(grid);

            createStoreShelves();

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('click', onClick);

            document.getElementById('btn-replay').addEventListener('click', animateForecastDrain);
            document.getElementById('btn-refill').addEventListener('click', animateOrderRefill);

            animate();
        }

        function getColorForRisk(risk) {
            if (risk === 'HIGH') return 0xff0055;
            if (risk === 'MEDIUM') return 0xffaa00;
            return 0x00ff88;
        }

        function createStoreShelves() {
            // Clear existing
            itemCrates.forEach(c => scene.remove(c.mesh));
            itemCrates = [];

            // Base Shelf Bay Structure
            const shelfGeo = new THREE.BoxGeometry(22, 0.4, 6);
            const shelfMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.2 });
            
            for (let s = 0; s < 3; s++) {
                const shelf = new THREE.Mesh(shelfGeo, shelfMat);
                shelf.position.set(0, s * 4 + 0.2, 0);
                scene.add(shelf);
            }

            // Create Product Crates
            const startX = -8;
            itemsData.forEach((item, idx) => {
                const xPos = startX + (idx % 5) * 4;
                const shelfIndex = Math.floor(idx / 5);
                const yPos = shelfIndex * 4 + 1.2;

                const colorHex = getColorForRisk(item.risk);
                const height = Math.max(0.6, (item.stock / (item.forecast + 1e-5)) * 2.5);

                const crateGeo = new THREE.BoxGeometry(2.5, height, 2.5);
                const crateMat = new THREE.MeshStandardMaterial({
                    color: colorHex,
                    emissive: colorHex,
                    emissiveIntensity: item.risk === 'HIGH' ? 0.6 : 0.2,
                    roughness: 0.3,
                    metalness: 0.5
                });

                const crateMesh = new THREE.Mesh(crateGeo, crateMat);
                crateMesh.position.set(xPos, yPos + height / 2, 0);
                crateMesh.userData = item;
                scene.add(crateMesh);

                // Add Warning Beacon for HIGH risk items
                if (item.risk === 'HIGH') {
                    const beaconGeo = new THREE.CylinderGeometry(0.1, 0.4, 8, 16);
                    const beaconMat = new THREE.MeshBasicMaterial({
                        color: 0xff0055,
                        transparent: true,
                        opacity: 0.4
                    });
                    const beaconMesh = new THREE.Mesh(beaconGeo, beaconMat);
                    beaconMesh.position.set(xPos, yPos + 4, 0);
                    scene.add(beaconMesh);
                    crateMesh.userData.beacon = beaconMesh;
                }

                itemCrates.push({ mesh: crateMesh, data: item, baseHeight: height, originalStock: item.stock });
            });
        }

        function onMouseMove(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(itemCrates.map(c => c.mesh));

            const tooltip = document.getElementById('tooltip');
            if (intersects.length > 0) {
                const item = intersects[0].object.userData;
                tooltip.style.display = 'block';
                tooltip.style.left = (event.clientX + 15) + 'px';
                tooltip.style.top = (event.clientY + 15) + 'px';
                tooltip.innerHTML = `
                    <strong style="color:#00f3ff">${item.product} (${item.store})</strong><br/>
                    Category: ${item.category}<br/>
                    Current Stock: ${item.stock} units<br/>
                    7-Day Forecast: ${item.forecast} units<br/>
                    Risk: <span style="color:${item.risk==='HIGH'?'#ff0055':(item.risk==='MEDIUM'?'#ffaa00':'#00ff88')}">${item.risk} (${(item.prob*100).toFixed(0)}%)</span>
                `;
            } else {
                tooltip.style.display = 'none';
            }
        }

        function onClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(itemCrates.map(c => c.mesh));
            if (intersects.length > 0) {
                const item = intersects[0].object.userData;
                document.getElementById('status-text').innerText = `Selected: ${item.product} (${item.risk} Risk)`;
            }
        }

        function animateForecastDrain() {
            if (isAnimating) return;
            isAnimating = true;
            let step = 0;
            const interval = setInterval(() => {
                step++;
                itemCrates.forEach(c => {
                    const drainedStock = Math.max(0, c.originalStock - Math.round((c.data.forecast / 7.0) * step));
                    const newHeight = Math.max(0.2, (drainedStock / (c.data.forecast + 1e-5)) * 2.5);
                    c.mesh.scale.y = newHeight / c.baseHeight;
                });
                document.getElementById('status-text').innerText = `Simulating 7-Day Demand Drain... Day ${step}/7`;
                if (step >= 7) {
                    clearInterval(interval);
                    isAnimating = false;
                    document.getElementById('status-text').innerText = `Drain Complete: Stockouts exposed!`;
                }
            }, 400);
        }

        function animateOrderRefill() {
            itemCrates.forEach(c => {
                c.mesh.scale.y = 1.0;
            });
            document.getElementById('status-text').innerText = `Replenishment order delivered! Shelves refilled.`;
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Pulse warning beacons
            itemCrates.forEach(c => {
                if (c.mesh.userData.beacon) {
                    c.mesh.userData.beacon.rotation.y += 0.03;
                    c.mesh.userData.beacon.material.opacity = 0.3 + Math.sin(Date.now() * 0.005) * 0.2;
                }
            });

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
